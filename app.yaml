  # -------------------- FRONTEND (Next.js) --------------------
  - name: web
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    source_dir: /frontend
    github:
      repo: Patio-Esperanza/ProyectoPatioEsperanza
      branch: master
      deploy_on_push: true
    build_command: |
      npm ci
      npm run build
    run_command: |
      npm start
    routes:
      - path: /
    envs:
      # ${api.PUBLIC_URL} solo resuelve en RUN_TIME, nunca en BUILD_TIME (limitacion de DO
      # App Platform). Next.js incrusta NEXT_PUBLIC_* en el bundle durante el build, asi que
      # una variable bindable aqui queda vacia y cae al fallback "http://localhost:8000".
      # api y web comparten el mismo dominio con rutas /api y /, asi que dejamos el valor
      # vacio para que las llamadas sean relativas al mismo origen.
      - key: NEXT_PUBLIC_API_URL
        value: ""
        scope: BUILD_TIME
