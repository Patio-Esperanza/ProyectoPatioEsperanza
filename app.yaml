name: patio-esperanza
region: sfo

services:
  # -------------------- BACKEND API (FastAPI) --------------------
  - name: api
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    source_dir: /backend
    github:
      repo: Patio-Esperanza/ProyectoPatioEsperanza
      branch: master
      deploy_on_push: true
    build_command: |
      pip install --no-cache-dir -r requirements.txt
    run_command: |
      PYTHONPATH=. alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    routes:
      - path: /api
        preserve_path_prefix: true
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        value: "EV[1:CGuvkr18JF9dBsZ75dbjenK3Z2AiTQZx:PFSqga/r/uLjTWpifDRRuyqpW9SoIKaFcY5LiKxP+qexMu5EJ6XXy/4asdMlC3SK3QuEv6j44FghhCny2IDeTM22wrg2kDw2Rh+mviIpMVwYwxd5TMwr6xaruywLGtO7hSOQ4J8bTVBDkz1V6Z1uM3GgtB6iM+rxLRi76qTazO/ztT597pHC4+uFqshUtU0owksh+6Ebp1SYNsvozww8]"
        scope: RUN_TIME
        type: SECRET
