name: patio-esperanza
region: sfo

services:
  # -------------------- BACKEND API (FastAPI) --------------------
  - name: api
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    source_dir: /backend
    github:
      repo: Patio-Esperanza/ProyectoPatioEsperanza
      branch: master
      deploy_on_push: true
    build_command: |
      pip install --no-cache-dir -r requirements.txt
    run_command: |
      PYTHONPATH=. alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    routes:
      - path: /api
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        value: "CAMBIAR_POR_URL_DEL_CLUSTER_EXISTENTE"
        scope: RUN_TIME
        type: SECRET
      - key: MIGRATIONS_DATABASE_URL
        value: "CAMBIAR_POR_URL_DEL_CLUSTER_EXISTENTE"
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        value: "CAMBIAR_POR_SECRETO_LARGO"
        scope: RUN_TIME
        type: SECRET
      - key: JWT_EXPIRES_MINUTES
        value: "60"
        scope: RUN_TIME
      - key: CORS_ORIGINS
        value: "https://patio-esperanza-o7e6x.ondigitalocean.app"
        scope: RUN_TIME
      - key: SENDGRID_API_KEY
        value: "CAMBIAR_POR_API_KEY"
        scope: RUN_TIME
        type: SECRET
      - key: SENDGRID_FROM_EMAIL
        value: "noreplay@patiolaesperanza.com.mx"
        scope: RUN_TIME

  # -------------------- FRONTEND (Next.js) --------------------
  - name: web
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    source_dir: /frontend
    github:
      repo: Patio-Esperanza/ProyectoPatioEsperanza
      branch: master
      deploy_on_push: true
    build_command: |
      npm ci
      npm run build
    run_command: |
      npm start
    routes:
      - path: /
    envs:
      # ${api.PUBLIC_URL} solo resuelve en RUN_TIME, nunca en BUILD_TIME (limitacion de DO
      # App Platform). Next.js incrusta NEXT_PUBLIC_* en el bundle durante el build, asi que
      # una variable bindable aqui queda vacia y cae al fallback "http://localhost:8000".
      # api y web comparten el mismo dominio con rutas /api y /, asi que dejamos el valor
      # vacio para que las llamadas sean relativas al mismo origen.
      - key: NEXT_PUBLIC_API_URL
        value: ""
        scope: BUILD_TIME
